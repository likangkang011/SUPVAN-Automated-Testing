[pytest]
# 注意：pytest 的 ini 文件不支持「行内注释」，注释必须独占一行，
#      否则 # 后面的内容会被当成配置值的一部分。

# 测试用例所在文件夹（相对路径）
testpaths = testcases
# 测试文件命名规则
python_files = test_*.py
# 测试函数命名规则
python_functions = test_*
# 测试类命名规则
python_classes = Test*

# ============ 实时日志：让每一步都看得见 ============
# 元素等待、命中、失败等信息会实时打印到控制台，不用等跑完才看
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %H:%M:%S

# ============ 快速失败：第一个用例失败就停止 ============
# 不想要「一失败就整体停下」时，把 --maxfail=1 删掉即可。
# 只想临时生效也可以用命令行：pytest -x
addopts = -v --maxfail=1
